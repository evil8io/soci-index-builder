name: build

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      upstream_sha:
        description: "Upstream commit to build; empty builds the upstream main HEAD"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}

env:
  UPSTREAM_REPO: awslabs/cfn-ecr-aws-soci-index-builder

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      tag: ${{ steps.resolve.outputs.tag }}
      build: ${{ steps.resolve.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.upstream_sha || '' }}
        run: |
          set -euo pipefail
          ref="${INPUT_SHA}"
          if [[ -z "${ref}" ]]; then
            ref=$(git ls-remote "https://github.com/${UPSTREAM_REPO}.git" refs/heads/main | awk '{print $1}')
          fi
          read -r sha date < <(gh api "repos/${UPSTREAM_REPO}/commits/${ref}" \
            --jq '.sha + " " + .commit.committer.date')
          day=${date:0:10}
          tag="v${day//-/}-${sha:0:8}"
          if gh release view "${tag}" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            build=false
            echo "release ${tag} already exists"
          else
            build=true
          fi
          {
            echo "sha=${sha}"
            echo "tag=${tag}"
            echo "build=${build}"
          } >> "$GITHUB_OUTPUT"
          echo "upstream ${sha} -> ${tag} (build=${build})"
      - name: Keepalive
        if: steps.resolve.outputs.build == 'false' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          last=$(git log -1 --format=%ct)
          if (( $(date +%s) - last <= 50 * 86400 )); then
            echo "last commit is recent enough"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive"
          git push

  build:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: awslabs/cfn-ecr-aws-soci-index-builder
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: functions/source/soci-index-generator-lambda/go.mod
          cache: false
      - name: Build and zip
        working-directory: functions/source/soci-index-generator-lambda
        run: |
          set -euo pipefail
          GOOS=linux go build -mod=vendor \
            -tags "osusergo netgo static_build lambda.norpc" \
            -ldflags '-extldflags "-static"' -o bootstrap
          zip "soci-index-generator-${{ matrix.arch }}.zip" bootstrap
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soci-index-generator-${{ matrix.arch }}
          path: functions/source/soci-index-generator-lambda/soci-index-generator-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      SHA: ${{ needs.resolve.outputs.sha }}
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: awslabs/cfn-ecr-aws-soci-index-builder
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 1
          path: upstream
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: soci-index-generator-*
          merge-multiple: true
          path: dist
      - name: Package the filter Lambda and write checksums
        run: |
          set -euo pipefail
          zip -j dist/ecr-image-action-event-filtering.zip \
            upstream/functions/source/ecr-image-action-event-filtering/ecr_image_action_event_filtering_lambda_function.py
          cd dist
          sha256sum -- *.zip > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" dist/*.zip dist/SHA256SUMS \
            --notes "Built from [\`${UPSTREAM_REPO}@${SHA}\`](https://github.com/${UPSTREAM_REPO}/commit/${SHA})."
      - name: Record the upstream sha
        run: |
          set -euo pipefail
          echo "${SHA}" > upstream-sha
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: build ${TAG}" upstream-sha
          git push origin main
